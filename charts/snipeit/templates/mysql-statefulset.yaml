# Derived from values.yaml's mysql.* fields — not given verbatim in either
# source document (the CI/CD guide only referenced this file's existence in
# §2.1's layout; the companion design doc that would define it wasn't
# available when this was generated). Review against that companion doc
# before treating this as final.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snipeit.labels" . | nindent 4 }}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.image }}"
          envFrom:
            - configMapRef: { name: snipeit-config }
            - secretRef: { name: mysql-app-secret }
          ports:
            - containerPort: 3306
          resources: {{ toYaml .Values.resources.mysql | nindent 12 }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mysql.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}

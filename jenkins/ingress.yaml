# jenkins/jenkins Helm chart creates a Service named "jenkins" listening on
# port 8080 (controller.serviceType=ClusterIP, set in install.sh) — Jenkins
# itself serves plain HTTP, same pattern as argocd/ingress.yaml: TLS
# terminates here, at ingress-nginx, using the internal CA, not inside the
# app itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: jenkins
  annotations:
    cert-manager.io/cluster-issuer: "internal-ca-issuer"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # Jenkins' classic UI and most plugins work fine without this, but
    # some (large plugin uploads, Blue Ocean) need a bigger body size than
    # nginx's 1m default — cheap to set up front rather than debug later.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["jenkins.internal.lan"]
      secretName: jenkins-tls
  rules:
    - host: jenkins.internal.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
